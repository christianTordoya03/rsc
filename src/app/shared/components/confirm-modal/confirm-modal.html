<div *ngIf="isOpen" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
  <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col transform transition-all animate-slide-up">
    
    <!-- Ícono y Mensaje Dinámico -->
    <div class="p-6 text-center">
      <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>
      <h3 class="text-lg font-bold text-slate-800 mb-2">{{ title }}</h3>
      <p class="text-sm text-slate-500">{{ message }}</p>
    </div>

    <!-- Botones Dinámicos -->
    <div class="bg-slate-50 px-6 py-4 flex gap-3 justify-center border-t border-slate-100">
      <button (click)="cancel.emit()" class="w-full px-4 py-2.5 text-sm font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
        {{ cancelText }}
      </button>
      <button (click)="confirm.emit()" class="w-full px-4 py-2.5 text-sm font-bold text-white bg-red-500 rounded-lg hover:bg-red-600 shadow-sm transition-colors">
        {{ confirmText }}
      </button>
    </div>
    
  </div>
</div>

<div 
  class="fixed inset-y-0 left-0 z-[60] h-full w-64 bg-[#1E1B4B] shadow-2xl flex flex-col transform transition-transform duration-300 lg:static lg:translate-x-0"
  [ngClass]="isOpen ? 'translate-x-0' : '-translate-x-full'">
  
  <!-- Header del Sidebar con Logo -->
  <div class="flex items-center justify-between h-16 px-6 bg-[#16133a] border-b border-[#2d295e] flex-shrink-0">
    <img src="rsc.png" alt="RSC" class="h-8 object-contain bg-white rounded px-2">
    <!-- Botón X para cerrar en móvil -->
    <button (click)="onClose()" class="lg:hidden text-slate-300 hover:text-white focus:outline-none p-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Navegación -->
  <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
    <a *ngFor="let item of menuItems" 
       [routerLink]="item.path" 
       routerLinkActive="bg-[#2E2856] text-white border-l-4 border-[#4F46E5]"
       (click)="onClose()"
       class="flex items-center px-4 py-3 text-sm font-medium text-slate-300 rounded-r-lg hover:bg-[#2E2856] hover:text-white transition-all border-l-4 border-transparent cursor-pointer">
      <span class="truncate">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Footer del Sidebar -->
  <div class="p-4 border-t border-[#2d295e] text-xs text-slate-500 text-center font-medium">
    Versión 1.0.0
  </div>
</div>

<div class="flex h-screen overflow-hidden bg-slate-50 w-full">
  
  <!-- Fondo oscuro para móviles cuando el menú está abierto -->
  <div *ngIf="isSidebarOpen" (click)="toggleSidebar()" class="fixed inset-0 z-20 bg-slate-900/50 backdrop-blur-sm lg:hidden transition-opacity"></div>

  <!-- Menú Lateral: Clases estructurales en el host -->
  <app-sidebar 
    class="absolute z-30 h-full lg:relative lg:flex-shrink-0 lg:block lg:w-64 transition-transform"
    [isOpen]="isSidebarOpen" 
    (closeSidebar)="toggleSidebar()">
  </app-sidebar>

  <!-- Contenedor del contenido derecho -->
  <div class="flex flex-col flex-1 w-0 overflow-hidden">
    <!-- Barra Superior -->
    <app-topbar (openSidebar)="toggleSidebar()"></app-topbar>

    <!-- Área de contenido -->
    <main class="flex-1 relative z-0 overflow-y-auto p-4 lg:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<app-toast-container></app-toast-container>

<header class="bg-white shadow-sm border-b border-slate-200 z-10 h-16 flex items-center justify-between px-4 lg:px-6">
  
  <!-- Botón hamburguesa para móviles -->
  <button (click)="openSidebar.emit()" class="lg:hidden text-slate-500 hover:text-[#4F46E5] transition-colors focus:outline-none p-1">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>
  
  <!-- Espaciador -->
  <div class="flex-1 lg:flex-none"></div>
  
  <!-- Perfil Dinámico de Usuario -->
  <div class="flex items-center gap-3">
    
    <!-- Info Oculta en móviles, visible en Desktop -->
    <div class="text-right hidden sm:block">
      <p class="text-sm font-bold text-slate-700">{{ userName }}</p>
      <p class="text-[10px] font-bold text-[#4F46E5] uppercase tracking-wider">{{ userRole }}</p>
    </div>
    
    <!-- Círculo de Perfil (Con Iniciales Reales) -->
    <div class="h-10 w-10 rounded-full bg-[#1E1B4B] flex items-center justify-center text-white font-bold text-sm shadow-sm border-2 border-indigo-100">
      {{ userInitials }}
    </div>
    
    <!-- Separador sutil -->
    <div class="w-px h-6 bg-slate-200 mx-1"></div>
    
    <!-- Botón Cerrar Sesión -->
    <button (click)="cerrarSesion()" title="Cerrar Sesión" class="text-slate-400 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 transition-all focus:outline-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
    </button>
  </div>
</header>

<div class="min-h-screen bg-slate-100 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">
  
  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <img class="mx-auto h-20 w-auto object-contain bg-white rounded-xl px-4 py-2 shadow-sm" src="rsc.png" alt="RSC Diesel">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900 tracking-tight">
      Portal Operativo
    </h2>
    <p class="mt-2 text-center text-sm text-slate-600">
      Ingrese su DNI o CE para acceder a su perfil
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="bg-white py-8 px-4 shadow-2xl sm:rounded-2xl sm:px-10 border border-slate-200">
      
      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <!-- Único campo: Documento -->
        <div>
          <label for="documento" class="block text-sm font-bold text-slate-700 mb-1">
            DNI o Carné de Extranjería
          </label>
          <div class="mt-1 relative">
            <input id="documento" type="text" formControlName="documento" maxlength="12"
              class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-[#4F46E5] focus:border-[#4F46E5] sm:text-lg font-bold text-center tracking-widest uppercase"
              placeholder="Ej. 74859612">
          </div>
          <p *ngIf="loginForm.get('documento')?.touched && loginForm.get('documento')?.invalid" class="mt-2 text-xs text-red-600 font-medium text-center">
            Ingrese un documento válido.
          </p>
        </div>

        <div>
          <button type="submit" [disabled]="isLoading"
            class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-[#1E1B4B] hover:bg-[#2E2856] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#4F46E5] transition-all relative overflow-hidden disabled:opacity-70 disabled:cursor-not-allowed">
            <span *ngIf="isLoading" class="absolute left-6 w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            {{ isLoading ? 'VERIFICANDO CREDENCIALES...' : 'INGRESAR AL SISTEMA' }}
          </button>
        </div>
      </form>
      
      <div class="mt-6 border-t border-slate-100 pt-6">
        <p class="text-xs text-center text-slate-400 font-medium">
          Servicios RSC Diesel E.I.R.L. &copy; 2026<br>Acceso exclusivo para personal autorizado
        </p>
      </div>

    </div>
  </div>
</div>
